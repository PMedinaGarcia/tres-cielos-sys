# Railway service: API
# Dashboard: Root Directory = / (repo root)
# Build Command:  pnpm install && pnpm --filter @tres-cielos/shared build && pnpm --filter @tres-cielos/api prisma:generate && pnpm --filter @tres-cielos/api build
# Start/Release:  pnpm --filter @tres-cielos/api prisma:deploy && pnpm --filter @tres-cielos/api start:prod
# Healthcheck:    /health
#
# Link Postgres → DATABASE_URL, Redis → REDIS_URL
# CORS_ORIGINS = public URL of web service

[build]
builder = "NIXPACKS"
buildCommand = "pnpm install && pnpm --filter @tres-cielos/shared build && pnpm --filter @tres-cielos/api prisma:generate && pnpm --filter @tres-cielos/api build"

[deploy]
startCommand = "pnpm --filter @tres-cielos/api prisma:deploy && pnpm --filter @tres-cielos/api start:prod"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
