# Catálogo duro — paquetes
#
# EVT-J1-TC = Paquete Estándar / Paquete Bodas 2027 (base).
# EVT-J1-PREMIUM = Upgrade Premium (estándar + extras).
# Precios por tramo de aforo: catalog/precios.yaml (2027-01-01 .. 2027-12-31).
# NO sustituye fixtures/catalog/golden-snapshot.json.

paquetes:
  - sku: EVT-J1-PREMIUM
    nombre: Upgrade Premium (Paquete Bodas)
    tipo_evento: boda
    sede: jardin-1
    aforo_min: 100
    aforo_max: 300
    descripcion_corta: Paquete estándar más table styling, barra de servicio/DJ booth, barra libre nacional, sillas premium, plafón de diseño y menú 100% res. Tarifas 2027 por tramo de invitados.
    estado: publicado
    linea: premium
    edicion: "2027"
    notas_validacion:
      - aforos_intermedios_no_interpolados
      - ficha_titulada_paquete_bodas

  - sku: EVT-J1-TC
    nombre: Paquete Estándar (Paquete Bodas / Paquete TC)
    tipo_evento: boda
    sede: jardin-1
    aforo_min: 100
    aforo_max: 300
    descripcion_corta: Evento de tres días (viernes cortesía, sábado gran evento, domingo parrillada condicionada). Tarifas 2027 por tramo de invitados.
    estado: publicado
    linea: tc
    alias:
      - Paquete TC
      - Paquete Estándar
      - Paquete Bodas
    edicion: "2027"
    notas_validacion:
      - aforos_intermedios_no_interpolados
      - ficha_titulada_paquete_bodas

  - sku: RENTA-J1
    nombre: Solo renta
    tipo_evento: multi
    sede: jardin-1
    aforo_min: 1
    aforo_max: 999
    descripcion_corta: Locación 11 h con carpa de cocina, limpieza, suite y valet. No incluye planta de luz ni banquete. Sin tarifa publicada en ficha Bodas 2027.
    estado: publicado
    linea: renta
    edicion: "2026-07"
    notas_validacion:
      - tarifa_oficial_pendiente
      - unidad_de_precio_por_persona_vs_evento_pendiente
